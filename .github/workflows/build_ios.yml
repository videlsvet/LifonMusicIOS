name: Build iOS App (.ipa)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build unsigned .app
        id: build_step
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project LifonMusic.xcodeproj \
            -scheme LifonMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR="build" 2>&1 | tee xcodebuild.log

      - name: Save errors to branch on failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-logs
          echo "=== XCODEBUILD LOG ===" > build_errors.txt
          grep -E -C 3 "error:|BUILD FAILED" xcodebuild.log >> build_errors.txt || tail -n 100 xcodebuild.log >> build_errors.txt
          git add build_errors.txt
          git commit -m "Build error log"
          git push origin build-logs --force

      - name: Create .ipa package
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/LifonMusic.app Payload/
          zip -r LifonMusic.ipa Payload
          rm -rf Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifonMusic-iOS-IPA
          path: LifonMusic.ipa
          retention-days: 14
